<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G20 Economic Monitor</title>
  <meta name="description" content="Live G20 economic data — GDP, inflation, unemployment, debt, and more. Powered by World Bank, IMF, and OECD open data.">

  <!-- Fallback font while Geist loads from @font-face in CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/main.css">

  <!-- Config must load before everything -->
  <script src="config.js"></script>
</head>
<body>

<div class="shell" id="app">

  <!-- ── Rail / Sidebar ─────────────────────────────────────────────────────── -->
  <aside class="rail" id="rail">
    <div class="rail__brand">
      <div class="rail__mark">G20</div>
      <div>
        <div class="rail__title">Monitor <span class="badge">live</span></div>
        <div class="rail__sub" id="rail-period">Q4·2024</div>
      </div>
    </div>

    <div class="rail__switch" title="World Bank · IMF · OECD open data">
      <div class="rail__switch-left">
        <span class="rail__switch-dot"></span>
        <span>Public dataset</span>
      </div>
      <span class="rail__switch-chev">⌄</span>
    </div>

    <div class="rail__hdr">Browse</div>
    <nav class="rail__nav" id="rail-nav">
      <!-- Populated by main.js -->
    </nav>

    <div class="rail__spacer"></div>

    <div class="rail__foot">
      <div class="rail__userbox">
        <div class="rail__avatar">G20</div>
        <div>
          <div class="rail__user-name">Public viewer</div>
          <div class="rail__user-sub" id="data-status">Loading data…</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Main column ────────────────────────────────────────────────────────── -->
  <div class="main-col" id="main-col">

    <!-- Command bar -->
    <header class="cmdbar" id="cmdbar">
      <div class="crumbs" id="crumbs">
        <span>Monitor</span>
        <span class="sep">/</span>
        <span class="here" id="crumb-page">Overview</span>
      </div>
      <div class="cmd-search">
        <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/>
        </svg>
        Search country, indicator, or year…
        <span class="kbd-hint">⌘ K</span>
      </div>
      <div class="cmd-actions">
        <div class="live-pill">
          <span class="dot"></span>
          <span id="live-time">Live · —</span>
        </div>
        <button class="ask-btn" id="ask-btn" onclick="toggleAgentDrawer()">
          <svg class="ai-glyph" viewBox="0 0 14 14" fill="currentColor">
            <path d="M7 0l1.5 3.5L12 5 8.5 6.5 7 10 5.5 6.5 2 5l3.5-1.5z"/>
          </svg>
          Ask AI
        </button>
      </div>
    </header>

    <!-- Page root — content swapped by router -->
    <div id="page-root" style="flex:1">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <span>Fetching World Bank &amp; IMF data…</span>
      </div>
    </div>

    <!-- News strip (footer) -->
    <div class="news-strip" id="news-strip">
      <div class="news-strip__lbl">
        <span class="news-strip__dot"></span>
        Wires
      </div>
      <div class="news-strip__track" id="news-strip-track">
        <span class="news-strip__item" style="color:rgba(245,245,242,0.3)">Loading headlines…</span>
      </div>
    </div>

  </div><!-- /.main-col -->

</div><!-- /.shell -->

<!-- ── Agent drawer ────────────────────────────────────────────────────────────── -->
<div class="agent-drawer-backdrop" id="agent-drawer-backdrop" onclick="toggleAgentDrawer()"></div>
<aside class="agent-drawer" id="agent-drawer">
  <div class="agent-head">
    <div class="agent-head-title">
      <svg class="agent-head-icon" width="16" height="16" viewBox="0 0 14 14" fill="currentColor">
        <path d="M7 0l1.5 3.5L12 5 8.5 6.5 7 10 5.5 6.5 2 5l3.5-1.5z"/>
      </svg>
      AI Economic Analyst
    </div>
    <button class="agent-close" onclick="toggleAgentDrawer()" aria-label="Close">×</button>
  </div>
  <div class="agent-input-area">
    <input class="agent-input" id="agent-input" type="text"
      placeholder="Ask about G20 economies…"
      onkeydown="if(event.key==='Enter') sendAgentQuestion()">
    <button class="agent-send" id="agent-send" onclick="sendAgentQuestion()">Ask</button>
  </div>
  <div class="agent-body" id="agent-body"></div>
  <div class="agent-foot">
    <div class="agent-suggested">
      <label>Suggested</label>
      <button class="agent-sq" onclick="askSuggested(this)">Show me the G20 fiscal health overview — debt, deficits, and tax revenue.</button>
      <button class="agent-sq" onclick="askSuggested(this)">Compare India, China, and USA economic performance.</button>
      <button class="agent-sq" onclick="askSuggested(this)">Which economies are showing signs of recession risk?</button>
      <button class="agent-sq" onclick="askSuggested(this)">Show the G20 youth unemployment rankings.</button>
    </div>
  </div>
</aside>

<!-- Scripts — order matters: config → data → atoms → motion → components → main -->
<script src="data.js"></script>
<script src="components/atoms.js"></script>
<script src="components/motion.js"></script>
<script src="components/commentary.js"></script>
<script src="components/overview.js"></script>
<script src="components/country.js"></script>
<script src="components/compare.js"></script>
<script src="components/flags.js"></script>
<script src="components/news.js"></script>
<script src="components/insights.js"></script>
<script src="main.js"></script>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</body>
</html>
