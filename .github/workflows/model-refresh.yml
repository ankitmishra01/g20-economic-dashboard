name: Forecast model refresh
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Structural economic refresh"]
    types: [completed]
permissions:
  contents: write
# Every job that commits generated data shares this group, so they never race.
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  train:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node sync/fetch-term-spread.js && node sync/train-forecast.js && node sync/train-projections.js
      - name: Commit model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/legacy/term-spread.js public/legacy/forecast-model.js public/legacy/forecast-history.json public/legacy/projections.json public/legacy/projection-history.json
          if git diff --staged --quiet; then echo "No change"; exit 0; fi
          git commit -m "chore: refresh forecast models [skip ci]"
          .github/scripts/push-with-retry.sh
