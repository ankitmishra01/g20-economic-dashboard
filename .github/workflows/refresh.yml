name: Refresh G20 Economic Data

on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of every month at 06:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write   # needed so the "Commit updated commentary + forecast artifacts" step can push

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify refresh credentials
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "SUPABASE_SERVICE_ROLE_KEY is not configured" && exit 1)

      - name: Fetch, seed data, and generate commentary
        run: node sync/seed.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Refresh yield-curve term spread + retrain forecast model
        run: |
          node sync/fetch-term-spread.js   # keyless FRED -> app/term-spread.js (committed static asset)
          node sync/train-forecast.js      # -> app/forecast-model.js (+ app/forecast-history.json)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Commit updated commentary + forecast artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/components/commentary.js app/term-spread.js app/forecast-model.js app/forecast-history.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update commentary + forecast $(date -u +'%Y-%m') [skip ci]"
            git push
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: sync/report.json
          if-no-files-found: ignore
