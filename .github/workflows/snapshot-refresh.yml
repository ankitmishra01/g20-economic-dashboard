name: Offline snapshot refresh
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Forecast model refresh"]
    types: [completed]
permissions:
  contents: write
jobs:
  snapshot:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node sync/snapshot.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Build global data shards (public/legacy/data)
        run: node sync/shards.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Commit offline snapshot and shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/legacy/data-snapshot.json public/legacy/data
          git diff --staged --quiet || (git commit -m "chore: refresh offline snapshot and data shards [skip ci]" && git push)
