name: Release-sensitive refresh
on:
  # Schedule retired in Phase 0: it targeted the retired PR #11 surfaces and
  # failed or opened issues on every run. Manual dispatch is kept.
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected release ingestion
        run: curl --fail --retry 3 -H "Authorization: Bearer $CRON_SECRET" "$PRODUCTION_URL/api/cron/ingest"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
